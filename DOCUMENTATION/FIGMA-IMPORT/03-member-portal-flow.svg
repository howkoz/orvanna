<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker></defs><g id="Board background"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF"/></g><g id="Board title"><rect x="72" y="48" width="8" height="46" rx="4" fill="#4F46E5"/><text x="96" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Function, the member portal</text><text x="96" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">site/index.html. One landing view, five boards, five tabs, and the only light theme in the system.</text></g><g id="node-sign-in-2"><rect x="96" y="176" width="260" height="132" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="112" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Sign in</text><text x="112" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">login.html</text><text x="112" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Glass card on the navy field</text><text x="112" y="266" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Error box collapses when empty</text></g><g id="flow-29"><line x1="356" y1="242" x2="424" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-the-office,-landing"><rect x="428" y="176" width="300" height="132" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="444" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">The Office, landing</text><text x="444" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Identity rail, then five boards</text><text x="444" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">stacked down the page</text><text x="444" y="266" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Tree demoted behind one control</text></g><text x="96" y="372" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="0.14em">THE FIVE BOARDS OF THE OFFICE</text><g id="node-gate-board"><rect x="96" y="396" width="332" height="150" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="112" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Gate Board</text><text x="112" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Who is short, and by how much.</text><text x="112" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Open part of the scale is hatched,</text><text x="112" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">never filled.</text></g><g id="node-momentum-board"><rect x="448" y="396" width="332" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="464" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Momentum Board</text><text x="464" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Six months of volume.</text><text x="464" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Own is solid, customer is hatched.</text><text x="464" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Under 560 px it becomes six rows.</text></g><g id="node-rank-runway"><rect x="800" y="396" width="332" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="816" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Rank Runway</text><text x="816" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Stops across the ranks, the current</text><text x="816" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">one bold. Micro meters for each</text><text x="816" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">unmet requirement.</text></g><g id="node-earnings-mix"><rect x="1152" y="396" width="332" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="1168" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Earnings Mix</text><text x="1168" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Five level fills. The label carries</text><text x="1168" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">its own dark chip so contrast</text><text x="1168" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">stops depending on the fill.</text></g><g id="node-the-wire"><rect x="1504" y="396" width="332" height="150" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1520" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">The Wire</text><text x="1520" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Company notices on a hanging rail.</text><text x="1520" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">One mark is lit. Self contained,</text><text x="1520" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">no outside feed.</text></g><text x="96" y="610" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="0.14em">THE FIVE TABS</text><g id="node-my-business-2"><rect x="96" y="634" width="332" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="112" y="662" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">My Business</text><text x="112" y="686" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Team tree, hairline connectors</text><text x="112" y="705" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Customers drawn dashed, not solid</text></g><g id="node-my-volume-2"><rect x="448" y="634" width="332" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="464" y="662" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">My Volume</text><text x="464" y="686" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Stacked bars, own plus customer</text><text x="464" y="705" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Hatch means an open gap</text></g><g id="node-my-rank-2"><rect x="800" y="634" width="332" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="816" y="662" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">My Rank</text><text x="816" y="686" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Requirement list with met marks</text><text x="816" y="705" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Progress bar per requirement</text></g><g id="node-my-statement-2"><rect x="1152" y="634" width="332" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="1168" y="662" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">My Statement</text><text x="1168" y="686" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Sticky header table</text><text x="1168" y="705" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Tabular numerals, level chips</text></g><g id="node-company-2"><rect x="1504" y="634" width="332" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="1520" y="662" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Company</text><text x="1520" y="686" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Rank spread bars</text><text x="1520" y="705" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Distribution across the field</text></g><g id="Theme note"><rect x="96" y="800" width="1752" height="178" rx="14" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="120" y="834" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="start" letter-spacing="0.14em">THIS IS THE ONE PLACE WITH TWO THEMES</text><text x="120" y="866" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">portal.css defines the whole palette on bare :root as dark, then html[data-theme=&quot;light&quot;] restates only the tokens that must change.</text><text x="120" y="892" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">The corrections of 2026-08-15: cyan text became #0E7490, qualified green became #065F46, not qualified red became #B91C1C, amber became #B45309.</text><text x="120" y="918" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Rule that came out of it: a colour may never be defined ONLY inside a theme block. It is defined on bare :root first, then restated.</text><text x="120" y="950" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Second lesson, same day: cyan was swept alone, so green, red and amber were missed. Sweep the whole palette, never one token.</text></g><g id="Board footer"><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#CBD5E1" stroke-width="1"/><text x="72" y="1032" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Orvanna design system  |  generated 2026-08-15  |  hardcoded colours, no theme variables</text></g></svg>