<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker></defs><g id="Board background"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF"/></g><g id="Board title"><rect x="72" y="48" width="8" height="46" rx="4" fill="#4F46E5"/><text x="96" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Theming, and the accessibility floor</text><text x="96" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">One rule, two corrections made on 2026-08-15, and the four steps that make the light theme work.</text></g><text x="96" y="152" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="start" letter-spacing="0.14em">THE RULE</text><g id="The rule"><rect x="96" y="172" width="1752" height="128" rx="14" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="120" y="208" font-family="Inter, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">A colour is NEVER defined only inside a media query or a data-theme block.</text><text x="120" y="240" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Define the complete palette on bare :root. A theme block may only RESTATE a token that already exists there.</text><text x="120" y="266" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">If a token exists only inside a theme block, every viewer outside that theme gets an empty value and the browser falls back to something nobody chose.</text></g><text x="96" y="348" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" letter-spacing="0.14em">THE TWO CORRECTIONS OF 2026-08-15</text><g id="Correction one disabled button"><rect x="96" y="368" width="858" height="320" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="96" y="368" width="858" height="42" rx="14" fill="#FEF2F2"/><text x="120" y="396" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="start">ONE  The disabled button</text><text x="120" y="442" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="0.12em">BEFORE</text><rect x="120" y="456" width="240" height="44" rx="8" fill="#8FE9F6" stroke="#CBD5E1" stroke-width="1"/><text x="240" y="484" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#7FA0AA" text-anchor="middle">Pay now</text><text x="120" y="522" font-family="'Roboto Mono', Consolas, monospace" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">opacity: 0.45 on ink over cyan</text><text x="120" y="544" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">1.70 to 1.  Fails the 4.5 to 1 floor.</text><text x="500" y="442" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="0.12em">AFTER</text><rect x="500" y="456" width="240" height="44" rx="8" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/><text x="620" y="484" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Pay now</text><text x="500" y="522" font-family="'Roboto Mono', Consolas, monospace" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">#0F172A on #64748B, opacity 1</text><text x="500" y="544" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">3.75 to 1.  Still short of 4.5.</text><text x="120" y="578" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Why it mattered: payment now opens automatically, so the pay</text><text x="120" y="596" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">button sits disabled for about two seconds on EVERY payment.</text><text x="120" y="614" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">The least readable state became one of the most seen.</text><text x="120" y="640" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">OPEN: the comment claims 4.63 to 1. It does not reproduce.</text><text x="120" y="658" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">Measured 3.75 to 1. Lightening the field to #7C8AA0, already a</text><text x="120" y="674" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">token here, keeps the ink and gives 5.10 to 1.</text></g><g id="Correction two light theme"><rect x="990" y="368" width="858" height="320" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="990" y="368" width="858" height="42" rx="14" fill="#FFFBEB"/><text x="1014" y="396" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">TWO  The light theme of the portal</text><text x="1014" y="438" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="0.1em">TOKEN</text><text x="1160" y="438" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="0.1em">WAS</text><text x="1420" y="438" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="0.1em">NOW</text><rect x="1014" y="458" width="812" height="34" rx="6" fill="#F8FAFC"/><text x="1024" y="481" font-family="'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">--cyan</text><rect x="1160" y="466" width="18" height="18" rx="4" fill="#22D3EE" stroke="#CBD5E1" stroke-width="1"/><text x="1186" y="481" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#22D3EE</text><text x="1290" y="481" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">1.73 to 1</text><rect x="1420" y="466" width="18" height="18" rx="4" fill="#0E7490" stroke="#CBD5E1" stroke-width="1"/><text x="1446" y="481" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#0E7490</text><text x="1550" y="481" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="start">5.36 to 1</text><rect x="1014" y="498" width="812" height="34" rx="6" fill="#F8FAFC"/><text x="1024" y="521" font-family="'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">--good</text><rect x="1160" y="506" width="18" height="18" rx="4" fill="#34D399" stroke="#CBD5E1" stroke-width="1"/><text x="1186" y="521" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#34D399</text><text x="1290" y="521" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">3.28 to 1</text><rect x="1420" y="506" width="18" height="18" rx="4" fill="#065F46" stroke="#CBD5E1" stroke-width="1"/><text x="1446" y="521" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#065F46</text><text x="1550" y="521" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="start">6.72 to 1</text><rect x="1014" y="538" width="812" height="34" rx="6" fill="#F8FAFC"/><text x="1024" y="561" font-family="'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">--bad</text><rect x="1160" y="546" width="18" height="18" rx="4" fill="#F87171" stroke="#CBD5E1" stroke-width="1"/><text x="1186" y="561" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#F87171</text><text x="1290" y="561" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">4.12 to 1</text><rect x="1420" y="546" width="18" height="18" rx="4" fill="#B91C1C" stroke="#CBD5E1" stroke-width="1"/><text x="1446" y="561" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#B91C1C</text><text x="1550" y="561" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="start">5.53 to 1</text><rect x="1014" y="578" width="812" height="34" rx="6" fill="#F8FAFC"/><text x="1024" y="601" font-family="'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">--amber</text><rect x="1160" y="586" width="18" height="18" rx="4" fill="#FBBF24" stroke="#CBD5E1" stroke-width="1"/><text x="1186" y="601" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#FBBF24</text><text x="1290" y="601" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">1.67 to 1</text><rect x="1420" y="586" width="18" height="18" rx="4" fill="#B45309" stroke="#CBD5E1" stroke-width="1"/><text x="1446" y="601" font-family="'Roboto Mono', Consolas, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">#B45309</text><text x="1550" y="601" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="start">5.02 to 1</text><text x="1014" y="620" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="start">Cyan was fixed in the morning. Green, red and amber were missed because only cyan was swept.</text></g><text x="96" y="718" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="0.14em">HOW THE TWO THEMES ARE ACTUALLY WIRED</text><g id="node-1--bare-:root"><rect x="96" y="740" width="400" height="150" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="112" y="768" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">1  Bare :root</text><text x="112" y="792" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">The COMPLETE palette lives here.</text><text x="112" y="811" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">In the portal that palette is the</text><text x="112" y="830" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">dark one, because dark is the</text><text x="112" y="849" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">default the member sees.</text></g><g id="flow-35"><line x1="496" y1="815" x2="556" y2="815" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-2--html[data-theme=&quot;light&quot;"><rect x="560" y="740" width="400" height="150" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="576" y="768" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">2  html[data-theme=&quot;light&quot;]</text><text x="576" y="792" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Restates ONLY the tokens that</text><text x="576" y="811" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">must change. Twenty two of them.</text><text x="576" y="830" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">It never introduces a token that</text><text x="576" y="849" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">bare :root has not already set.</text></g><g id="flow-36"><line x1="960" y1="815" x2="1020" y2="815" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-3--a-button-flips-it"><rect x="1024" y="740" width="400" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="1040" y="768" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">3  A button flips it</text><text x="1040" y="792" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">The theme button writes the</text><text x="1040" y="811" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">attribute on &lt;html&gt;. Nothing else</text><text x="1040" y="830" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">in the page knows or cares which</text><text x="1040" y="849" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">theme is running.</text></g><g id="flow-37"><line x1="1424" y1="815" x2="1484" y2="815" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-4--drawings-follow"><rect x="1488" y="740" width="360" height="150" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="1504" y="768" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">4  Drawings follow</text><text x="1504" y="792" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Chart fills resolve through</text><text x="1504" y="811" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">drawing tokens, so a chart</text><text x="1504" y="830" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">restates itself with the theme</text><text x="1504" y="849" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">instead of being redrawn.</text></g><g id="Where light exists"><rect x="96" y="892" width="1752" height="96" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="120" y="922" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start" letter-spacing="0.14em">AND WHERE LIGHT DOES NOT EXIST</text><text x="120" y="952" font-family="Inter, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">Only the member portal has two themes. The corporate site, the shop, the product page, the login page and the staff console are dark only, on purpose:</text><text x="120" y="974" font-family="Inter, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">the glow language IS the brand, and a light version of it would be a second design system to maintain rather than a second theme.</text></g><g id="Board footer"><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#CBD5E1" stroke-width="1"/><text x="72" y="1032" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Orvanna design system  |  generated 2026-08-15  |  hardcoded colours, no theme variables</text></g></svg>