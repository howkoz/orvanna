<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker></defs><g id="Board background"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF"/></g><g id="Board title"><rect x="72" y="48" width="8" height="46" rx="4" fill="#4F46E5"/><text x="96" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Function, the staff call console</text><text x="96" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">staff.html. Six steps of a phone call, three cards that keep the agent inside the rules, and the deliberate differences from the shop.</text></g><text x="96" y="152" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start" letter-spacing="0.14em">THE CALL, LEFT TO RIGHT</text><g id="node-1--lookup"><rect x="96" y="176" width="274" height="118" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="112" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">1  Lookup</text><text x="112" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Type ahead, arrow keys,</text><text x="112" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">visible grabbable scrollbar</text></g><g id="node-2--snapshot"><rect x="396" y="176" width="274" height="118" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="412" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">2  Snapshot</text><text x="412" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Name, code, rank chip,</text><text x="412" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">qualified chip, four stats</text></g><g id="flow-30"><line x1="370" y1="235" x2="392" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-3--notes"><rect x="696" y="176" width="274" height="118" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="712" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">3  Notes</text><text x="712" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Free text, saved per member</text><text x="712" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">in this browser only</text></g><g id="flow-31"><line x1="670" y1="235" x2="692" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-4--quick-order"><rect x="996" y="176" width="274" height="118" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="1012" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">4  Quick order</text><text x="1012" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Product, billing mode, quantity</text><text x="1012" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">then a line table and totals</text></g><g id="flow-32"><line x1="970" y1="235" x2="992" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-5--payment"><rect x="1296" y="176" width="274" height="118" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1312" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">5  Payment</text><text x="1312" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Payment link is the</text><text x="1312" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">recommended path</text></g><g id="flow-33"><line x1="1270" y1="235" x2="1292" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-6--confirmation"><rect x="1596" y="176" width="274" height="118" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="1612" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">6  Confirmation</text><text x="1612" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Built to be read down</text><text x="1612" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">a phone line</text></g><g id="flow-34"><line x1="1570" y1="235" x2="1592" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><text x="96" y="360" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" letter-spacing="0.14em">WHAT THE CONSOLE REFUSES TO DO</text><g id="node-agent-rule-card,-always-on"><rect x="96" y="384" width="560" height="172" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/><text x="112" y="412" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Agent rule card, always on screen</text><text x="112" y="436" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">A red bordered card sits above the payment</text><text x="112" y="455" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">controls so the standing rules never need a</text><text x="112" y="474" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">manual: the link path first, never read a card</text><text x="112" y="493" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">number back, never finish a bank approval on</text><text x="112" y="512" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">behalf of the caller.</text></g><g id="node-waiting-on-the-bank,-said-"><rect x="688" y="384" width="560" height="172" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="704" y="412" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Waiting on the bank, said honestly</text><text x="704" y="436" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">An amber card that states plainly that only the</text><text x="704" y="455" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">cardholder can finish the approval, shows the</text><text x="704" y="474" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">order number in monospace, and offers an</text><text x="704" y="493" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">abandon control so nothing is left sitting</text><text x="704" y="512" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">in limbo.</text></g><g id="node-read-aloud-confirmation"><rect x="1280" y="384" width="568" height="172" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="1296" y="412" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Read aloud confirmation</text><text x="1296" y="436" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Order number set huge in monospace, a phonetic</text><text x="1296" y="455" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">spelling under it, and say blocks: short scripted</text><text x="1296" y="474" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">lines with a cyan left rule, written to be spoken</text><text x="1296" y="493" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">word for word rather than summarised.</text></g><text x="96" y="620" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="0.14em">HOW THE CONSOLE DIFFERS FROM THE SHOP, ON PURPOSE</text><g id="diff-width"><rect x="96" y="648" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="648" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="676" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Width</text><text x="392" y="676" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">1240 px work surface, against 1100 px for marketing.</text></g><g id="diff-glow"><rect x="96" y="700" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="700" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="728" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Glow</text><text x="392" y="728" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">One calm wash at roughly a third of the marketing dose.</text></g><g id="diff-motion"><rect x="96" y="752" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="752" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="780" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Motion</text><text x="392" y="780" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">No reveal animations at all. Work tools do not perform.</text></g><g id="diff-density"><rect x="96" y="804" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="804" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="832" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Density</text><text x="392" y="832" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">16 to 18 px panel padding, against 30 to 36 px.</text></g><g id="diff-primary-button"><rect x="96" y="856" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="856" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="884" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Primary button</text><text x="392" y="884" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Indigo #4F46E5 with white text, not the cyan of the shop.</text></g><g id="diff-focus"><rect x="96" y="908" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="908" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="936" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Focus</text><text x="392" y="936" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">A 2 px cyan outline with 1 px offset on every field.</text></g><g id="diff-contrast"><rect x="96" y="960" width="1752" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="960" width="5" height="44" rx="2.5" fill="#7C3AED"/><text x="120" y="988" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Contrast</text><text x="392" y="988" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Every interactive colour is annotated in the file with its measured ratio.</text></g><g id="Board footer"><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#CBD5E1" stroke-width="1"/><text x="72" y="1032" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Orvanna design system  |  generated 2026-08-15  |  hardcoded colours, no theme variables</text></g></svg>