<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker></defs><g id="Board background"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF"/></g><g id="Board title"><rect x="72" y="48" width="8" height="46" rx="4" fill="#4F46E5"/><text x="96" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">The component inventory</text><text x="96" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Twelve components that make up every screen in the pilot. What each looks like, and where it appears.</text></g><g id="node-button,-solid"><rect x="96" y="152" width="558" height="190" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="112" y="180" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Button, solid</text><text x="112" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Cyan field, ink #05121C label, 8 px radius.</text><text x="112" y="223" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Hover lifts 2 px and widens the glow.</text><text x="112" y="242" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: every primary action in shop and site.</text></g><g id="node-button,-ghost"><rect x="682" y="152" width="558" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="698" y="180" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Button, ghost</text><text x="698" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Dark gradient field, indigo border, #E2E8F0 label.</text><text x="698" y="223" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Hover swaps the border and label to cyan.</text><text x="698" y="242" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: secondary actions, back, cancel.</text></g><g id="node-button,-disabled"><rect x="1268" y="152" width="558" height="190" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="1284" y="180" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Button, disabled</text><text x="1284" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">STATES BOTH COLOURS: #0F172A on #64748B. Measures 3.75 to 1.</text><text x="1284" y="223" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Never an opacity fade, which measured 1.70 to 1.</text><text x="1284" y="242" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: the pay button, for about 2 seconds, every payment.</text></g><g id="node-glass-panel"><rect x="96" y="366" width="558" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="112" y="394" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Glass panel</text><text x="112" y="418" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Translucent gradient, 1 px luminous border, 14 px radius,</text><text x="112" y="437" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">outer glow plus a 1 px inset highlight along the top.</text><text x="112" y="456" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: every card, every panel, the login card.</text></g><g id="node-product-card"><rect x="682" y="366" width="558" height="190" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="698" y="394" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Product card</text><text x="698" y="418" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Icon, tier badge, name, description, price row, add button.</text><text x="698" y="437" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Hover lifts 5 px and the border turns cyan.</text><text x="698" y="456" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: the three tier bands of the shop.</text></g><g id="node-summary-row"><rect x="1268" y="366" width="558" height="190" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="1284" y="394" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Summary row</text><text x="1284" y="418" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Name left, amount right, tabular numerals, hairline under.</text><text x="1284" y="437" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Children indent 16 px and read Included at $0.00.</text><text x="1284" y="456" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: cart drawer, checkout summary, confirmation.</text></g><g id="node-badge-and-pill"><rect x="96" y="580" width="558" height="190" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="112" y="608" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Badge and pill</text><text x="112" y="632" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">999 px radius, 0.6 to 0.7 rem, 700, wide tracking.</text><text x="112" y="651" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Tier, billing mode, rank, qualified, demo, included.</text><text x="112" y="670" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: everywhere a row needs a one word fact.</text></g><g id="node-meter"><rect x="682" y="580" width="558" height="190" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="698" y="608" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Meter</text><text x="698" y="632" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">8 px track, indigo to cyan fill, turns solid cyan and lights</text><text x="698" y="651" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">its note when the 100 Personal Volume gate is met.</text><text x="698" y="670" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: cart drawer, checkout summary, staff totals.</text></g><g id="node-form-field"><rect x="1268" y="580" width="558" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="1284" y="608" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Form field</text><text x="1284" y="632" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Field 12 px by 14 px, 8 px radius, dark inset background.</text><text x="1284" y="651" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Focus: cyan border plus a 3 px cyan ring. Console uses a</text><text x="1284" y="670" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">2 px cyan outline instead. Placeholder #8B99AF, 4.9 to 1.</text></g><g id="node-table"><rect x="96" y="794" width="558" height="190" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="112" y="822" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Table</text><text x="112" y="846" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Sticky uppercase header, 1 px row rules, tabular numerals,</text><text x="112" y="865" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">monospace for codes, wide content scrolls in its own box.</text><text x="112" y="884" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: statement table, console order lines.</text></g><g id="node-challenge-chrome-2"><rect x="682" y="794" width="558" height="190" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="698" y="822" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Challenge chrome</text><text x="698" y="846" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Fixed bar at the clamped maximum z-index 2147483647, moved</text><text x="698" y="865" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">to the end of body so it wins the tie on document order.</text><text x="698" y="884" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Carries the order number, the notice and cancel.</text></g><g id="node-skeleton"><rect x="1268" y="794" width="558" height="190" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="1284" y="822" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Skeleton</text><text x="1284" y="846" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">42 px bars that hold the exact height of the real card form</text><text x="1284" y="865" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">and pulse at 1.4 s. The pulse stops under reduced motion.</text><text x="1284" y="884" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Where: the roughly 2 seconds before the card form arrives.</text></g><g id="Board footer"><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#CBD5E1" stroke-width="1"/><text x="72" y="1032" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Orvanna design system  |  generated 2026-08-15  |  hardcoded colours, no theme variables</text></g></svg>