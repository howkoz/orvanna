<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker></defs><g id="Board background"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF"/></g><g id="Board title"><rect x="72" y="48" width="8" height="46" rx="4" fill="#4F46E5"/><text x="96" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Function, the shop and the checkout</text><text x="96" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">shop.html and product.html. Seven steps, one branch for the bank, and the six states the shopper actually watches change.</text></g><text x="96" y="152" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="0.14em">HAPPY PATH</text><g id="node-catalog"><rect x="96" y="176" width="228" height="126" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="112" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Catalog</text><text x="112" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Tier filter pills</text><text x="112" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Product cards, 3 up</text></g><g id="node-add-to-cart"><rect x="350" y="176" width="228" height="126" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="366" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Add to cart</text><text x="366" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Button fills cyan</text><text x="366" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">then flashes a tick</text></g><g id="flow-19"><line x1="324" y1="239" x2="346" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-cart-drawer-2"><rect x="604" y="176" width="228" height="126" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="620" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Cart drawer</text><text x="620" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Lines, quantity steppers</text><text x="620" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Personal Volume meter</text></g><g id="flow-20"><line x1="578" y1="239" x2="600" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-step-1-account"><rect x="858" y="176" width="228" height="126" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="874" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Step 1 Account</text><text x="874" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Sign in or continue</text><text x="874" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">as a guest</text></g><g id="flow-21"><line x1="832" y1="239" x2="854" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-step-2-delivery"><rect x="1112" y="176" width="228" height="126" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="1128" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Step 2 Delivery</text><text x="1128" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Radio option cards</text><text x="1128" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Free option lit cyan</text></g><g id="flow-22"><line x1="1086" y1="239" x2="1108" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-step-3-payment"><rect x="1366" y="176" width="228" height="126" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/><text x="1382" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Step 3 Payment</text><text x="1382" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Four method buttons</text><text x="1382" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Card form skeleton</text></g><g id="flow-23"><line x1="1340" y1="239" x2="1362" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="node-step-4-place"><rect x="1620" y="176" width="228" height="126" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1636" y="204" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Step 4 Place</text><text x="1636" y="228" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Pay button disables</text><text x="1636" y="247" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">for about 2 seconds</text></g><g id="flow-24"><line x1="1594" y1="239" x2="1616" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><text x="96" y="372" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.14em">THE BANK BRANCH, ADDED PHASE 6</text><g id="node-order-number-is-held"><rect x="96" y="396" width="300" height="150" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="112" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Order number is held</text><text x="112" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Issued BEFORE the bank step,</text><text x="112" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">so a lost page is still</text><text x="112" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">traceable by number.</text></g><g id="node-challenge-chrome"><rect x="452" y="396" width="300" height="150" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="468" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Challenge chrome</text><text x="468" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Fixed bar at z-index</text><text x="468" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">2147483647, moved to the end</text><text x="468" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">of body so it wins the tie.</text></g><g id="node-bank-overlay"><rect x="808" y="396" width="300" height="150" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/><text x="824" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Bank overlay</text><text x="824" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">The bank&#x27;s own frame.</text><text x="824" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">We never style inside it.</text><text x="824" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Cancel stays reachable.</text></g><g id="node-approved"><rect x="1164" y="396" width="300" height="150" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/><text x="1180" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Approved</text><text x="1180" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Confirmation view.</text><text x="1180" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Order number, summary,</text><text x="1180" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">renewal note.</text></g><g id="node-page-was-taken-away"><rect x="1520" y="396" width="328" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="1536" y="424" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Page was taken away</text><text x="1536" y="448" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Resume view polls the</text><text x="1536" y="467" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">payment service, or looks</text><text x="1536" y="486" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">the order up by number.</text></g><g id="flow-25"><line x1="396" y1="471" x2="448" y2="471" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="flow-26"><line x1="752" y1="471" x2="804" y2="471" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="flow-27"><line x1="1108" y1="471" x2="1160" y2="471" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/></g><g id="flow-28"><path d="M 1108 500 Q 1314 600 1520 500" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/><rect x="1178.7" y="600.0" width="270.59999999999997" height="16" rx="4" fill="#FFFFFF"/><text x="1314.0" y="612.0" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">the shopper came back to a different page</text></g><text x="96" y="628" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="0.14em">WHAT THE SHOPPER SEES CHANGE</text><g id="state-cart-count-badge"><rect x="96" y="656" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="656" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="688" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Cart count badge</text><text x="452" y="688" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Scales to 1.35 for one beat on every add.</text></g><g id="state-personal-volume-meter"><rect x="96" y="716" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="716" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="748" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Personal Volume meter</text><text x="452" y="748" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Indigo to cyan fill; turns solid cyan and the note lights when 100 PV is reached.</text></g><g id="state-add-button"><rect x="96" y="776" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="776" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="808" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Add button</text><text x="452" y="808" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Label swaps to a tick, background goes solid cyan.</text></g><g id="state-pay-button,-disabled"><rect x="96" y="836" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="836" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="868" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Pay button, disabled</text><text x="452" y="868" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">States BOTH colours, ink #0F172A on slate #64748B, instead of an opacity fade. Measures 3.75 to 1: much better, still short of 4.5. See board 07.</text></g><g id="state-card-form-skeleton"><rect x="96" y="896" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="896" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="928" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Card form skeleton</text><text x="452" y="928" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Holds the exact height of the real form so nothing jumps when it arrives.</text></g><g id="state-page-behind-payment"><rect x="96" y="956" width="1752" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="96" y="956" width="5" height="52" rx="2.5" fill="#0E7490"/><text x="120" y="988" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Page behind payment</text><text x="452" y="988" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">body.payment-in-flight really disables the quantity, remove and pay controls.</text></g><g id="Board footer"><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#CBD5E1" stroke-width="1"/><text x="72" y="1032" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Orvanna design system  |  generated 2026-08-15  |  hardcoded colours, no theme variables</text></g></svg>