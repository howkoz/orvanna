<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="820" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="20" font-weight="600" fill="#111827">C. The tax flow, as rebuilt on 2026-08-15</text>
  <text x="30" y="60" font-size="13" fill="#4B5563">Two callers, one shared calculation. Quoting answers "what will this cost". Charging answers "what is being charged".</text>

  <!-- trigger -->
  <rect x="30" y="84" width="480" height="84" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="46" y="108" font-size="13.5" font-weight="600" fill="#111827">Anything that can move the total</text>
  <text x="46" y="130" font-size="12.5" fill="#374151">Cart quantity, add or remove, activation choice, the Tax ID</text>
  <text x="46" y="148" font-size="12.5" fill="#374151">field, the member code. Every one of them lands in one</text>
  <text x="46" y="164" font-size="12.5" fill="#374151">function, renderSummary, which is where both asks begin.</text>

  <line x1="180" y1="168" x2="180" y2="206" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="400" y1="168" x2="400" y2="206" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- quote branch -->
  <rect x="30" y="210" width="300" height="96" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="46" y="234" font-size="13.5" font-weight="600" fill="#111827">liveEnsureQuote</text>
  <text x="46" y="256" font-size="12.5" fill="#374151">Waits 350 milliseconds, then asks.</text>
  <text x="46" y="276" font-size="12.5" fill="#374151">Eager on purpose: a quote is cheap</text>
  <text x="46" y="294" font-size="12.5" fill="#374151">and creates nothing.</text>

  <!-- charge branch -->
  <rect x="360" y="210" width="300" height="96" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="376" y="234" font-size="13.5" font-weight="600" fill="#111827">liveEnsureCheckout</text>
  <text x="376" y="256" font-size="12.5" fill="#374151">Opens immediately the first time,</text>
  <text x="376" y="276" font-size="12.5" fill="#374151">waits 900 milliseconds when it is</text>
  <text x="376" y="294" font-size="12.5" fill="#374151">replacing a payment already open.</text>

  <line x1="180" y1="306" x2="180" y2="342" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="510" y1="306" x2="510" y2="342" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="346" width="300" height="96" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="46" y="370" font-size="13.5" font-weight="600" fill="#111827">quote-tax</text>
  <text x="46" y="392" font-size="12.5" fill="#374151">Prices the cart and answers.</text>
  <text x="46" y="412" font-size="12.5" fill="#374151">Creates nothing: no order row, no</text>
  <text x="46" y="430" font-size="12.5" fill="#374151">payment, no tax record.</text>

  <rect x="360" y="346" width="300" height="96" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="376" y="370" font-size="13.5" font-weight="600" fill="#111827">create-payment, the authority</text>
  <text x="376" y="392" font-size="12.5" fill="#374151">Reprices the cart from scratch,</text>
  <text x="376" y="412" font-size="12.5" fill="#374151">writes the order row, and opens the</text>
  <text x="376" y="430" font-size="12.5" fill="#374151">payment at that figure.</text>

  <line x1="180" y1="442" x2="180" y2="482" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="510" y1="442" x2="510" y2="482" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- shared code -->
  <rect x="30" y="486" width="630" height="120" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="46" y="510" font-size="14" font-weight="600" fill="#111827">functions/_shared/tax.ts, the one place tax is decided</text>
  <text x="46" y="534" font-size="12.5" fill="#374151">Both callers run the same resolveTaxAddress and the same calculateTax. They cannot disagree,</text>
  <text x="46" y="552" font-size="12.5" fill="#374151">because there is only one implementation to disagree with. Copying it into two files is exactly</text>
  <text x="46" y="570" font-size="12.5" fill="#374151">how a quote that says one number and a charge that says another gets written.</text>
  <text x="46" y="594" font-size="12.5" fill="#374151">If Stripe cannot be reached, the cart still prices at the flat rate and the outcome records "flat_fallback".</text>

  <line x1="345" y1="606" x2="345" y2="642" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="646" width="630" height="62" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="46" y="670" font-size="13.5" font-weight="600" fill="#111827">Stripe Tax calculation</text>
  <text x="46" y="692" font-size="12.5" fill="#374151">One line item for the whole taxable amount, priced exclusive of tax, against the destination read from the database.</text>

  <!-- three rules -->
  <rect x="690" y="84" width="400" height="240" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="706" y="108" font-size="13.5" font-weight="600" fill="#111827">The three rules it obeys</text>
  <text x="706" y="134" font-size="12.5" font-weight="600" fill="#111827">1. The destination comes from the database.</text>
  <text x="706" y="152" font-size="12.5" fill="#374151">Read from the member's row, never from the browser.</text>
  <text x="706" y="170" font-size="12.5" fill="#374151">A browser that picks its own destination picks its own rate.</text>
  <text x="706" y="196" font-size="12.5" font-weight="600" fill="#111827">2. Exemption is Stripe's decision, not the page's.</text>
  <text x="706" y="214" font-size="12.5" fill="#374151">The page sends the identifier as text. Stripe decides the</text>
  <text x="706" y="232" font-size="12.5" fill="#374151">effect. Honest limit: Stripe checks the format, not the</text>
  <text x="706" y="250" font-size="12.5" fill="#374151">government register, so a well formed fake passes.</text>
  <text x="706" y="276" font-size="12.5" font-weight="600" fill="#111827">3. A zero is never shown without its reason.</text>
  <text x="706" y="294" font-size="12.5" fill="#374151">"not_collecting" means we hold no registration there.</text>
  <text x="706" y="312" font-size="12.5" fill="#374151">Anything else means the place does not tax this.</text>

  <!-- three states -->
  <rect x="690" y="346" width="400" height="262" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="706" y="370" font-size="13.5" font-weight="600" fill="#111827">The three states of the tax row</text>

  <rect x="706" y="384" width="368" height="66" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
  <text x="720" y="406" font-size="12.5" font-weight="600" fill="#111827">Calculated</text>
  <text x="720" y="424" font-size="12" fill="#374151">The engine has answered for exactly this cart.</text>
  <text x="720" y="440" font-size="12" fill="#374151">Reads "calculated NY", or "not collected", or "none due".</text>

  <rect x="706" y="460" width="368" height="66" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="720" y="482" font-size="12.5" font-weight="600" fill="#111827">Estimate, while it asks</text>
  <text x="720" y="500" font-size="12" fill="#374151">A placeholder that says so: "estimate, working it out".</text>
  <text x="720" y="516" font-size="12" fill="#374151">It never wears the answer's clothes.</text>

  <rect x="706" y="536" width="368" height="60" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="720" y="558" font-size="12.5" font-weight="600" fill="#111827">Flat, when no engine is live</text>
  <text x="720" y="576" font-size="12" fill="#374151">Demonstration mode only. The row reads "5 percent"</text>
  <text x="720" y="592" font-size="12" fill="#374151">and says that is what it is.</text>

  <!-- staleness -->
  <rect x="690" y="628" width="400" height="80" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="706" y="652" font-size="13.5" font-weight="600" fill="#111827">The staleness check</text>
  <text x="706" y="674" font-size="12.5" fill="#374151">Every answer is stamped with a signature of the cart it was</text>
  <text x="706" y="692" font-size="12.5" fill="#374151">asked about. An answer to a question nobody is asking any</text>
  <text x="706" y="704" font-size="12.5" fill="#374151">more is dropped, never painted.</text>

  <!-- after the sale -->
  <rect x="30" y="726" width="1060" height="62" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="46" y="750" font-size="13.5" font-weight="600" fill="#111827">After the sale: record-tax</text>
  <text x="46" y="772" font-size="12.5" fill="#374151">A calculation becomes a tax transaction only when a payment succeeds. Fired after the receipt renders, never in front of it, and idempotent, so a failure costs a retry rather than a lost record.</text>

  <text x="30" y="812" font-size="11.5" fill="#6B7280">Sources: functions/_shared/tax.ts, functions/quote-tax/index.ts, functions/create-payment/index.ts, functions/record-tax/index.ts, www/shop.html</text>
</svg>
