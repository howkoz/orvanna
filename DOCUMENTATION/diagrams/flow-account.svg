<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="700" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="20" font-weight="600" fill="#111827">B. The account step: guest or real sign-in, and how an order gets credited</text>
  <text x="30" y="60" font-size="13" fill="#4B5563">Both paths end at the same place. Which one was taken decides only whose name is on the order.</text>

  <!-- step 1 -->
  <rect x="330" y="84" width="300" height="60" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="346" y="108" font-size="13.5" font-weight="600" fill="#111827">Step 1, Account</text>
  <text x="346" y="130" font-size="12.5" fill="#374151">Sign in, or continue as a guest.</text>

  <line x1="420" y1="144" x2="230" y2="186" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="540" y1="144" x2="730" y2="186" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- sign-in branch -->
  <rect x="30" y="190" width="380" height="86" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="46" y="214" font-size="13.5" font-weight="600" fill="#111827">Sign in</text>
  <text x="46" y="236" font-size="12.5" fill="#374151">Member code and password typed on the page.</text>
  <text x="46" y="256" font-size="12.5" fill="#374151">Nothing is compared in the browser: the values</text>
  <text x="46" y="272" font-size="12.5" fill="#374151">go straight to the demo-login Edge Function.</text>

  <line x1="220" y1="276" x2="220" y2="312" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="316" width="380" height="104" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="46" y="340" font-size="13.5" font-weight="600" fill="#111827">demo-login checks it on the server</text>
  <text x="46" y="362" font-size="12.5" fill="#374151">Compared against bcrypt password hashes in</text>
  <text x="46" y="380" font-size="12.5" fill="#374151">app.demo_users, a table the public key cannot read.</text>
  <text x="46" y="400" font-size="12.5" fill="#374151">A wrong password is refused by the server.</text>
  <text x="46" y="416" font-size="12.5" fill="#374151">The role must come back as "member".</text>

  <line x1="220" y1="420" x2="220" y2="456" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="30" y="460" width="380" height="104" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="46" y="484" font-size="13.5" font-weight="600" fill="#111827">Signed in</text>
  <text x="46" y="506" font-size="12.5" fill="#374151">The display name is read from the public view</text>
  <text x="46" y="524" font-size="12.5" fill="#374151">v_demo_members. The street address stays synthetic:</text>
  <text x="46" y="542" font-size="12.5" fill="#374151">this demo holds no real addresses. The member code</text>
  <text x="46" y="560" font-size="12.5" fill="#374151">field is filled in and made read-only.</text>

  <!-- guest branch -->
  <rect x="560" y="190" width="390" height="86" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="576" y="214" font-size="13.5" font-weight="600" fill="#111827">Continue as a guest</text>
  <text x="576" y="236" font-size="12.5" fill="#374151">No credential at all. The address fields are cleared</text>
  <text x="576" y="256" font-size="12.5" fill="#374151">and the member code field stays empty and typable,</text>
  <text x="576" y="272" font-size="12.5" fill="#374151">so a shopper can still credit a sponsoring member.</text>

  <path d="M 940 276 L 966 276 L 966 502 L 954 502" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="560" y="316" width="390" height="126" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="576" y="340" font-size="13.5" font-weight="600" fill="#111827">Leaving a signed-in account</text>
  <text x="576" y="362" font-size="12.5" fill="#374151">Pressing Switch clears the read-only member code</text>
  <text x="576" y="380" font-size="12.5" fill="#374151">as well as the account. Without that, a guest order</text>
  <text x="576" y="398" font-size="12.5" fill="#374151">placed a moment later would still be credited to</text>
  <text x="576" y="416" font-size="12.5" fill="#374151">whoever signed in before.</text>
  <text x="576" y="434" font-size="12.5" fill="#374151">Typing in the field re-quotes tax and re-opens the payment.</text>

  <rect x="560" y="460" width="390" height="104" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="576" y="484" font-size="13.5" font-weight="600" fill="#111827">Checking out as a guest</text>
  <text x="576" y="506" font-size="12.5" fill="#374151">The order is attributed to whatever member code was</text>
  <text x="576" y="524" font-size="12.5" fill="#374151">typed, or to nobody if none was. A code that matches</text>
  <text x="576" y="542" font-size="12.5" fill="#374151">nothing never fails the order: the raw text is kept</text>
  <text x="576" y="560" font-size="12.5" fill="#374151">on the row and the member link is stored as empty.</text>

  <line x1="220" y1="564" x2="220" y2="596" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="700" y1="564" x2="700" y2="596" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- convergence -->
  <rect x="30" y="600" width="920" height="66" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="46" y="624" font-size="13.5" font-weight="600" fill="#111827">Both paths reach the same stage: the rest of the checkout appears, and the payment starts opening</text>
  <text x="46" y="646" font-size="12.5" fill="#374151">The member code is not only attribution. The server reads the tax destination from that member's row, so changing it re-asks what tax is owed.</text>

  <text x="30" y="688" font-size="11.5" fill="#6B7280">Sources: www/shop.html (account step), www/login.html, functions/create-payment/index.ts, functions/_shared/tax.ts</text>
</svg>
