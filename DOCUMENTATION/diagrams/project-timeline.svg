<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="712" viewBox="0 0 1420 712" font-family="Segoe UI, Tahoma, Verdana, sans-serif">

  <rect x="0" y="0" width="1420" height="712" fill="#FFFFFF"/>

  <text x="90" y="46" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="1.2">ORVANNA: WHAT THE TEAM BUILT, AND WHEN</text>
  <text x="90" y="72" font-size="13" fill="#5B6472">Three build days, 91 commits. A phase closes only when both gates return PASS: the verifier (are the numbers right) and quality assurance (is it complete and does it work).</text>

  <!-- day column headers -->
  <rect x="90" y="94" width="430" height="34" rx="6" fill="#E8EEFB" stroke="#C3CCDD"/>
  <text x="105" y="116" font-size="15" font-weight="700" fill="#0F172A">Thursday 13 August 2026</text>
  <text x="505" y="116" font-size="11" fill="#5B6472" text-anchor="end">day 1</text>

  <rect x="540" y="94" width="430" height="34" rx="6" fill="#E8EEFB" stroke="#C3CCDD"/>
  <text x="555" y="116" font-size="15" font-weight="700" fill="#0F172A">Friday 14 August 2026</text>
  <text x="955" y="116" font-size="11" fill="#5B6472" text-anchor="end">day 2</text>

  <rect x="990" y="94" width="340" height="34" rx="6" fill="#E8EEFB" stroke="#C3CCDD"/>
  <text x="1005" y="116" font-size="15" font-weight="700" fill="#0F172A">Saturday 15 August 2026</text>
  <text x="1315" y="116" font-size="11" fill="#5B6472" text-anchor="end">day 3</text>

  <!-- DAY 1 -->
  <rect x="100" y="142" width="410" height="34" rx="6" fill="#F2F4F7" stroke="#C3CCDD"/>
  <text x="114" y="164" font-size="13" fill="#0F172A">Phase 0: root split, guardrails, six-agent team</text>

  <rect x="100" y="188" width="410" height="34" rx="6" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="114" y="210" font-size="13" fill="#0F172A">Phase 1: schema spec, migrations 001-005, security on</text>
  <text x="496" y="210" font-size="10" fill="#3E6B48" text-anchor="end">BOTH GATES PASS</text>

  <rect x="100" y="234" width="410" height="34" rx="6" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="114" y="256" font-size="13" fill="#0F172A">Phase 2: seed of 1,000 members, 24,295 rows</text>
  <text x="496" y="256" font-size="10" fill="#3E6B48" text-anchor="end">BOTH GATES PASS</text>

  <rect x="100" y="280" width="410" height="34" rx="6" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="114" y="302" font-size="13" fill="#0F172A">Phase 3: commission engine, six months finalized</text>
  <text x="496" y="302" font-size="10" fill="#3E6B48" text-anchor="end">BOTH GATES PASS</text>

  <rect x="100" y="326" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="114" y="348" font-size="13" fill="#0F172A">Phase 4: member portal, five sections, live data</text>

  <rect x="100" y="372" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="114" y="394" font-size="13" fill="#0F172A">Phase 4B: corporate site, glow-tech design round</text>

  <rect x="100" y="418" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="114" y="440" font-size="13" fill="#0F172A">Phase 4C: shop, cart drawer, volume meter (overnight)</text>

  <!-- DAY 2 -->
  <rect x="550" y="142" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="564" y="164" font-size="13" fill="#0F172A">Shop round 4: 16 items, four-step checkout</text>

  <rect x="550" y="188" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="564" y="210" font-size="13" fill="#0F172A">Phase 4.5: staff call console (phone-order screen)</text>

  <rect x="550" y="234" width="410" height="34" rx="6" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="564" y="256" font-size="13" fill="#0F172A">Phase 5: orvanna.io goes live on the public internet</text>
  <text x="946" y="256" font-size="10" fill="#3E6B48" text-anchor="end">BOTH GATES PASS</text>

  <rect x="550" y="280" width="410" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="564" y="302" font-size="13" fill="#0F172A">Team page, server-checked sign-in, support chat</text>

  <rect x="550" y="326" width="410" height="34" rx="6" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="564" y="348" font-size="13" fill="#0F172A">Phase 6: real test payments, built and closed same day</text>
  <text x="946" y="348" font-size="10" fill="#3E6B48" text-anchor="end">BOTH GATES PASS</text>

  <rect x="550" y="372" width="410" height="34" rx="6" fill="#FBE9E9" stroke="#E4B9B9"/>
  <text x="564" y="394" font-size="13" fill="#0F172A">3DS built and deployed, no challenge fires</text>
  <text x="946" y="394" font-size="10" fill="#8A4141" text-anchor="end">BLOCKED</text>

  <rect x="550" y="418" width="410" height="34" rx="6" fill="#FBE9E9" stroke="#E4B9B9"/>
  <text x="564" y="440" font-size="13" fill="#0F172A">Tax engine attempt one: TaxJar signup errors out</text>
  <text x="946" y="440" font-size="10" fill="#8A4141" text-anchor="end">DEAD END</text>

  <!-- DAY 3 -->
  <rect x="1000" y="142" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="164" font-size="13" fill="#0F172A">3DS working on Braintree sandbox</text>

  <rect x="1000" y="188" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="210" font-size="13" fill="#0F172A">Challenge window built, stacking fixed</text>

  <rect x="1000" y="234" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="256" font-size="13" fill="#0F172A">Checkout reshaped to three screens</text>

  <rect x="1000" y="280" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="302" font-size="13" fill="#0F172A">Real member sign-in at checkout</text>

  <rect x="1000" y="326" width="320" height="34" rx="6" fill="#FBE9E9" stroke="#E4B9B9"/>
  <text x="1014" y="348" font-size="13" fill="#0F172A">Six audits run, four HIGH findings</text>
  <text x="1306" y="348" font-size="10" fill="#8A4141" text-anchor="end">GATES FAIL</text>

  <rect x="1000" y="372" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="394" font-size="13" fill="#0F172A">Stripe Tax live, real rates by address</text>

  <rect x="1000" y="418" width="320" height="34" rx="6" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="1014" y="440" font-size="13" fill="#0F172A">Tax quoted before the card is entered</text>

  <!-- legend -->
  <rect x="100" y="474" width="16" height="14" rx="3" fill="#EAF6EC" stroke="#B6D8BE"/>
  <text x="124" y="486" font-size="11" fill="#5B6472">closed on both gates</text>
  <rect x="262" y="474" width="16" height="14" rx="3" fill="#DFF3F7" stroke="#A9D8E2"/>
  <text x="286" y="486" font-size="11" fill="#5B6472">shipped, gate still owed</text>
  <rect x="440" y="474" width="16" height="14" rx="3" fill="#FBE9E9" stroke="#E4B9B9"/>
  <text x="464" y="486" font-size="11" fill="#5B6472">blocked, failed, or a dead end</text>
  <rect x="652" y="474" width="16" height="14" rx="3" fill="#F2F4F7" stroke="#C3CCDD"/>
  <text x="676" y="486" font-size="11" fill="#5B6472">setup work</text>

  <line x1="90" y1="508" x2="1330" y2="508" stroke="#C3CCDD" stroke-width="1"/>
  <text x="90" y="532" font-size="15" font-weight="700" fill="#0F172A" letter-spacing="1.1">THE FIVE MILESTONES</text>

  <!-- milestone cards -->
  <rect x="90" y="546" width="238" height="132" rx="8" fill="#F7F9FC" stroke="#C3CCDD"/>
  <polygon points="112,570 122,580 112,590 102,580" fill="#4F46E5"/>
  <text x="132" y="576" font-size="11" fill="#5B6472">14 August 2026</text>
  <text x="132" y="592" font-size="13" font-weight="700" fill="#0F172A">The site goes live</text>
  <text x="104" y="616" font-size="11" fill="#0F172A">https://orvanna.io serves the</text>
  <text x="104" y="632" font-size="11" fill="#0F172A">company site at the root and the</text>
  <text x="104" y="648" font-size="11" fill="#0F172A">member office at /portal/, pulling</text>
  <text x="104" y="664" font-size="11" fill="#0F172A">live data with a clean console.</text>

  <rect x="342" y="546" width="238" height="132" rx="8" fill="#F7F9FC" stroke="#C3CCDD"/>
  <polygon points="364,570 374,580 364,590 354,580" fill="#4F46E5"/>
  <text x="384" y="576" font-size="11" fill="#5B6472">14 to 15 August 2026</text>
  <text x="384" y="592" font-size="13" font-weight="700" fill="#0F172A">Sign-in becomes real</text>
  <text x="356" y="616" font-size="11" fill="#0F172A">A password box that accepted</text>
  <text x="356" y="632" font-size="11" fill="#0F172A">anything is replaced by accounts</text>
  <text x="356" y="648" font-size="11" fill="#0F172A">checked on the server, and the</text>
  <text x="356" y="664" font-size="11" fill="#0F172A">order is credited to that member.</text>

  <rect x="594" y="546" width="238" height="132" rx="8" fill="#F7F9FC" stroke="#C3CCDD"/>
  <polygon points="616,570 626,580 616,590 606,580" fill="#22D3EE"/>
  <text x="636" y="576" font-size="11" fill="#5B6472">15 August 2026</text>
  <text x="636" y="592" font-size="13" font-weight="700" fill="#0F172A">A real bank challenge</text>
  <text x="608" y="616" font-size="11" fill="#0F172A">Three-domain secure (3DS) runs</text>
  <text x="608" y="632" font-size="11" fill="#0F172A">end to end: the card is handed to</text>
  <text x="608" y="648" font-size="11" fill="#0F172A">the issuing bank, which puts up a</text>
  <text x="608" y="664" font-size="11" fill="#0F172A">real approval screen.</text>

  <rect x="846" y="546" width="238" height="132" rx="8" fill="#F7F9FC" stroke="#C3CCDD"/>
  <polygon points="868,570 878,580 868,590 858,580" fill="#22D3EE"/>
  <text x="888" y="576" font-size="11" fill="#5B6472">15 August 2026</text>
  <text x="888" y="592" font-size="13" font-weight="700" fill="#0F172A">Stripe Tax goes live</text>
  <text x="860" y="616" font-size="11" fill="#0F172A">A flat five percent is replaced by</text>
  <text x="860" y="632" font-size="11" fill="#0F172A">a real engine: a New York cart</text>
  <text x="860" y="648" font-size="11" fill="#0F172A">returns 8.875 percent. No rate is</text>
  <text x="860" y="664" font-size="11" fill="#0F172A">written into our code anywhere.</text>

  <rect x="1098" y="546" width="238" height="132" rx="8" fill="#F7F9FC" stroke="#C3CCDD"/>
  <polygon points="1120,570 1130,580 1120,590 1110,580" fill="#22D3EE"/>
  <text x="1140" y="576" font-size="11" fill="#5B6472">15 August 2026</text>
  <text x="1140" y="592" font-size="13" font-weight="700" fill="#0F172A">Tax before the card</text>
  <text x="1112" y="616" font-size="11" fill="#0F172A">Tax used to appear only once a</text>
  <text x="1112" y="632" font-size="11" fill="#0F172A">payment existed. A quote service</text>
  <text x="1112" y="648" font-size="11" fill="#0F172A">now prices the cart first, so the</text>
  <text x="1112" y="664" font-size="11" fill="#0F172A">total is known before paying.</text>

  <text x="90" y="700" font-size="10" fill="#5B6472">Source: the Orvanna git history (91 commits, 2026-08-13 to 2026-08-15), MLM-PILOT\ROADMAP.md, and the phase gate reports in MLM-PILOT\docs\qa\ and MLM-PILOT\docs\verification\.</text>

</svg>
