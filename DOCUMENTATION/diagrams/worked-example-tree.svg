<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#FFFFFF"/>

  <text x="28" y="36" font-size="21" font-weight="700" fill="#111827">The ten-member worked example, one month, every dollar shown</text>
  <text x="28" y="58" font-size="13" fill="#4B5563">Period 2026-07. Sales Volume (SV), Commissionable Volume (CV), Team Volume (TV). This is the engine's acceptance test: it reproduces these numbers to the cent.</text>

  <!-- edges -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <path d="M 490 192 L 490 212 L 187 212 L 187 230"/>
    <path d="M 490 192 L 490 230"/>
    <path d="M 490 192 L 490 212 L 850 212 L 850 230"/>
    <path d="M 187 312 L 187 332 L 100 332 L 100 350"/>
    <path d="M 187 312 L 187 332 L 275 332 L 275 350"/>
    <path d="M 527 312 L 527 332 L 440 332 L 440 350"/>
    <path d="M 527 312 L 527 332 L 615 332 L 615 350"/>
    <path d="M 100 432 L 100 470"/>
    <path d="M 615 432 L 615 470"/>
  </g>

  <!-- M1 root, Leader, earns -->
  <rect x="415" y="110" width="150" height="82" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
  <text x="425" y="130" font-size="13" font-weight="700" fill="#111827">M1</text>
  <text x="460" y="130" font-size="12" font-weight="700" fill="#166534">LEADER, depth 3</text>
  <text x="425" y="148" font-size="11.5" fill="#1F2937">SV 200.00, CV 160.00</text>
  <text x="425" y="164" font-size="11.5" fill="#1F2937">TV 2,500.00, 3 active legs</text>
  <text x="425" y="184" font-size="14" font-weight="700" fill="#166534">earns 114.00</text>

  <!-- M2 -->
  <rect x="112" y="230" width="150" height="82" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
  <text x="122" y="250" font-size="13" font-weight="700" fill="#111827">M2</text>
  <text x="157" y="250" font-size="12" font-weight="700" fill="#166534">MEMBER, depth 1</text>
  <text x="122" y="268" font-size="11.5" fill="#1F2937">SV 150.00, CV 120.00</text>
  <text x="122" y="284" font-size="11.5" fill="#1F2937">TV 500.00, 1 active leg</text>
  <text x="122" y="304" font-size="14" font-weight="700" fill="#166534">earns 16.00</text>

  <!-- M3 -->
  <rect x="452" y="230" width="150" height="82" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
  <text x="462" y="250" font-size="13" font-weight="700" fill="#111827">M3</text>
  <text x="497" y="250" font-size="12" font-weight="700" fill="#166534">BUILDER, depth 2</text>
  <text x="462" y="268" font-size="11.5" fill="#1F2937">SV 100.00, CV 80.00</text>
  <text x="462" y="284" font-size="11.5" fill="#1F2937">TV 1,650.00, 2 active legs</text>
  <text x="462" y="304" font-size="14" font-weight="700" fill="#166534">earns 130.00</text>

  <!-- M4 -->
  <rect x="775" y="230" width="150" height="82" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="785" y="250" font-size="13" font-weight="700" fill="#111827">M4</text>
  <text x="820" y="250" font-size="12" font-weight="700" fill="#1E3A8A">MEMBER, depth 1</text>
  <text x="785" y="268" font-size="11.5" fill="#1F2937">SV 100.00, CV 80.00</text>
  <text x="785" y="284" font-size="11.5" fill="#1F2937">all bought by customers</text>
  <text x="785" y="304" font-size="14" font-weight="700" fill="#1E3A8A">earns 0.00</text>

  <!-- M5 unqualified -->
  <rect x="25" y="350" width="150" height="82" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="35" y="370" font-size="13" font-weight="700" fill="#111827">M5</text>
  <text x="70" y="370" font-size="12" font-weight="700" fill="#92400E">NOT QUALIFIED</text>
  <text x="35" y="388" font-size="11.5" fill="#1F2937">SV 50.00, CV 40.00</text>
  <text x="35" y="404" font-size="11.5" fill="#1F2937">TV 300.00</text>
  <text x="35" y="424" font-size="14" font-weight="700" fill="#92400E">earns 0.00</text>

  <!-- M6 -->
  <rect x="200" y="350" width="150" height="82" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="210" y="370" font-size="13" font-weight="700" fill="#111827">M6</text>
  <text x="245" y="370" font-size="12" font-weight="700" fill="#1E3A8A">MEMBER, depth 1</text>
  <text x="210" y="388" font-size="11.5" fill="#1F2937">SV 150.00, CV 120.00</text>
  <text x="210" y="404" font-size="11.5" fill="#1F2937">TV 0.00, nobody below</text>
  <text x="210" y="424" font-size="14" font-weight="700" fill="#1E3A8A">earns 0.00</text>

  <!-- M7 -->
  <rect x="365" y="350" width="150" height="82" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="375" y="370" font-size="13" font-weight="700" fill="#111827">M7</text>
  <text x="410" y="370" font-size="12" font-weight="700" fill="#1E3A8A">MEMBER, depth 1</text>
  <text x="375" y="388" font-size="11.5" fill="#1F2937">SV 1,500.00, CV 1,200.00</text>
  <text x="375" y="404" font-size="11.5" fill="#1F2937">TV 0.00, nobody below</text>
  <text x="375" y="424" font-size="14" font-weight="700" fill="#1E3A8A">earns 0.00</text>

  <!-- M8 -->
  <rect x="540" y="350" width="150" height="82" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
  <text x="550" y="370" font-size="13" font-weight="700" fill="#111827">M8</text>
  <text x="585" y="370" font-size="12" font-weight="700" fill="#166534">MEMBER, depth 1</text>
  <text x="550" y="388" font-size="11.5" fill="#1F2937">SV 100.00, CV 80.00</text>
  <text x="550" y="404" font-size="11.5" fill="#1F2937">TV 50.00, 0 active legs</text>
  <text x="550" y="424" font-size="14" font-weight="700" fill="#166534">earns 4.00</text>

  <!-- M9 -->
  <rect x="25" y="470" width="150" height="82" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="35" y="490" font-size="13" font-weight="700" fill="#111827">M9</text>
  <text x="70" y="490" font-size="12" font-weight="700" fill="#1E3A8A">MEMBER, depth 1</text>
  <text x="35" y="508" font-size="11.5" fill="#1F2937">SV 300.00, CV 240.00</text>
  <text x="35" y="524" font-size="11.5" fill="#1F2937">TV 0.00, nobody below</text>
  <text x="35" y="544" font-size="14" font-weight="700" fill="#1E3A8A">earns 0.00</text>

  <!-- M10 -->
  <rect x="540" y="470" width="150" height="82" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="550" y="490" font-size="13" font-weight="700" fill="#111827">M10</text>
  <text x="590" y="490" font-size="12" font-weight="700" fill="#92400E">NOT QUALIFIED</text>
  <text x="550" y="508" font-size="11.5" fill="#1F2937">SV 50.00, CV 40.00</text>
  <text x="550" y="524" font-size="11.5" fill="#1F2937">TV 0.00</text>
  <text x="550" y="544" font-size="14" font-weight="700" fill="#92400E">earns 0.00</text>

  <!-- callouts -->
  <rect x="712" y="350" width="262" height="82" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
  <text x="726" y="370" font-size="12" font-weight="700" fill="#111827">Why M2 is only a Member</text>
  <text x="726" y="388" font-size="11.5" fill="#374151">M2 is qualified and has two legs, but</text>
  <text x="726" y="404" font-size="11.5" fill="#374151">the M5 leg does not count: M5's own SV</text>
  <text x="726" y="420" font-size="11.5" fill="#374151">is 50.00. One active leg, Builder needs 2.</text>

  <rect x="712" y="446" width="262" height="98" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
  <text x="726" y="466" font-size="12" font-weight="700" fill="#111827">Where the missing 36.00 went</text>
  <text x="726" y="484" font-size="11.5" fill="#374151">M5 is unqualified, so the 24.00 it would</text>
  <text x="726" y="500" font-size="11.5" fill="#374151">have earned on M9 is never paid.</text>
  <text x="726" y="516" font-size="11.5" fill="#374151">M2 is paid 1 level deep, so its 12.00</text>
  <text x="726" y="532" font-size="11.5" fill="#374151">claim on M9 is out of reach. Both = breakage.</text>

  <!-- totals bar -->
  <rect x="25" y="580" width="949" height="62" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="42" y="602" font-size="13" font-weight="700" fill="#111827">Company reconciliation for the month</text>
  <text x="42" y="622" font-size="12.5" fill="#1F2937">Total SV 2,700.00   |   Total CV 2,160.00 (0.80 x SV)   |   Total paid 264.00 = 114.00 + 16.00 + 130.00 + 4.00   |   4 of 10 members paid</text>
  <text x="42" y="638" font-size="12.5" fill="#3730A3">264.00 is 12.22% of CV and 9.78% of the 2,700.00 that came in the door.</text>

  <!-- legend -->
  <rect x="25" y="656" width="20" height="14" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="52" y="668" font-size="12" fill="#374151">earned money this month</text>
  <rect x="250" y="656" width="20" height="14" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="277" y="668" font-size="12" fill="#374151">qualified but earned nothing (nobody below them, or nobody in reach)</text>
  <rect x="700" y="656" width="20" height="14" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="727" y="668" font-size="12" fill="#374151">not qualified (SV under 100.00)</text>

  <text x="25" y="694" font-size="11.5" fill="#6B7280">Tree: M1 sponsors M2, M3, M4. M2 sponsors M5, M6. M3 sponsors M7, M8. M5 sponsors M9. M8 sponsors M10.</text>
  <text x="25" y="712" font-size="11.5" fill="#6B7280">M4's whole 100.00 SV was bought by two retail customers. Customer volume books to the referring member's account and counts exactly like their own.</text>
</svg>
