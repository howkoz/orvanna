<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <marker id="arwGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="1000" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="20" font-weight="600" fill="#111827">The seven states of a subscription, and the retry ladder underneath them</text>
  <text x="30" y="60" font-size="13" fill="#4B5563">Only a genuine processor-confirmed payment ever returns a subscription to ACTIVE. Cancelled is final.</text>

  <!-- ============ STATES ============ -->

  <!-- active -->
  <rect x="60" y="120" width="240" height="88" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="80" y="148" font-size="15" font-weight="700" fill="#14532D">ACTIVE</text>
  <text x="80" y="168" font-size="12" fill="#374151">In good standing. Bills on schedule,</text>
  <text x="80" y="184" font-size="12" fill="#374151">books volume on success, qualifies.</text>

  <!-- past_due -->
  <rect x="430" y="120" width="250" height="88" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="148" font-size="15" font-weight="700" fill="#78350F">PAST DUE</text>
  <text x="450" y="168" font-size="12" fill="#374151">The charge declined soft or unclear.</text>
  <text x="450" y="184" font-size="12" fill="#374151">Scheduled retries remain.</text>

  <!-- dunning -->
  <rect x="800" y="120" width="250" height="88" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="820" y="148" font-size="15" font-weight="700" fill="#7C2D12">DUNNING</text>
  <text x="820" y="168" font-size="12" fill="#374151">The member must be contacted.</text>
  <text x="820" y="184" font-size="12" fill="#374151">Late payday retries still run.</text>

  <!-- paused -->
  <rect x="60" y="330" width="240" height="88" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="80" y="358" font-size="15" font-weight="700" fill="#1E3A8A">PAUSED</text>
  <text x="80" y="378" font-size="12" fill="#374151">Member pause, one or two months.</text>
  <text x="80" y="394" font-size="12" fill="#374151">Nothing bills. Auto-resumes after.</text>

  <!-- card_update_required -->
  <rect x="430" y="330" width="250" height="88" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="450" y="358" font-size="15" font-weight="700" fill="#7F1D1D">CARD UPDATE REQUIRED</text>
  <text x="450" y="378" font-size="12" fill="#374151">Hard decline. No retry will ever run.</text>
  <text x="450" y="394" font-size="12" fill="#374151">Only exit: a fresh checkout, card in hand.</text>

  <!-- suspended -->
  <rect x="800" y="330" width="250" height="88" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="820" y="358" font-size="15" font-weight="700" fill="#1F2937">SUSPENDED</text>
  <text x="820" y="378" font-size="12" fill="#374151">The month ended unpaid. No billing.</text>
  <text x="820" y="394" font-size="12" fill="#374151">Reactivation with a fresh payment allowed.</text>

  <!-- cancelled -->
  <rect x="430" y="540" width="250" height="76" rx="12" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <text x="450" y="568" font-size="15" font-weight="700" fill="#111827">CANCELLED, final</text>
  <text x="450" y="588" font-size="12" fill="#374151">By the member, by the bank's stop</text>
  <text x="450" y="604" font-size="12" fill="#374151">instruction, or after two unpaid months.</text>

  <!-- ============ ARROWS ============ -->

  <!-- active -> past_due -->
  <line x1="300" y1="150" x2="426" y2="150" stroke="#D97706" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="312" y="142" font-size="11.5" fill="#92400E">soft decline</text>

  <!-- past_due -> active (retry succeeds) -->
  <line x1="426" y1="186" x2="300" y2="186" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arwGreen)"/>
  <text x="312" y="202" font-size="11.5" fill="#15803D">a retry pays</text>

  <!-- past_due -> dunning -->
  <line x1="680" y1="164" x2="796" y2="164" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="690" y="156" font-size="11.5" fill="#9A3412">retries spent</text>

  <!-- dunning -> active (long green return, over the top) -->
  <path d="M 925 120 L 925 92 L 180 92 L 180 116" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arwGreen)"/>
  <text x="500" y="86" font-size="11.5" fill="#15803D">a late retry or a fresh checkout pays</text>

  <!-- active -> paused -->
  <line x1="180" y1="208" x2="180" y2="326" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="190" y="266" font-size="11.5" fill="#1D4ED8">member pauses</text>

  <!-- paused -> active -->
  <line x1="120" y1="326" x2="120" y2="208" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arwGreen)"/>
  <text x="18" y="266" font-size="11.5" fill="#15803D">auto-resume</text>

  <!-- active/past_due -> card_update (hard decline) -->
  <line x1="530" y1="208" x2="530" y2="326" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arwRed)"/>
  <text x="540" y="258" font-size="11.5" fill="#B91C1C">hard decline, any attempt:</text>
  <text x="540" y="274" font-size="11.5" fill="#B91C1C">bad card number, expired,</text>
  <text x="540" y="290" font-size="11.5" fill="#B91C1C">lost or stolen, or a bank</text>
  <text x="540" y="306" font-size="11.5" fill="#B91C1C">challenge on a renewal</text>

  <!-- card_update -> active (fresh checkout) -->
  <path d="M 430 374 L 330 374 L 330 200 L 304 200" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arwGreen)"/>
  <text x="336" y="366" font-size="11.5" fill="#15803D">new card,</text>
  <text x="336" y="382" font-size="11.5" fill="#15803D">fresh checkout</text>

  <!-- dunning -> suspended -->
  <line x1="925" y1="208" x2="925" y2="326" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="935" y="266" font-size="11.5" fill="#4B5563">still unpaid at the</text>
  <text x="935" y="282" font-size="11.5" fill="#4B5563">day-26 checkpoint</text>

  <!-- card_update -> suspended -->
  <line x1="680" y1="374" x2="796" y2="374" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="694" y="366" font-size="11.5" fill="#4B5563">no card update</text>

  <!-- suspended -> active (reactivation, over the right edge) -->
  <path d="M 1050 356 L 1096 356 L 1096 70 L 180 70 L 180 116" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arwGreen)"/>
  <text x="700" y="64" font-size="11.5" fill="#15803D">reactivation: fresh payment, forward only, never back-billed</text>

  <!-- suspended -> cancelled -->
  <path d="M 900 418 L 900 578 L 684 578" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="740" y="570" font-size="11.5" fill="#374151">two consecutive unpaid months</text>

  <!-- paused/anywhere -> cancelled -->
  <path d="M 180 418 L 180 578 L 426 578" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="196" y="570" font-size="11.5" fill="#374151">member cancels, from any state</text>

  <!-- ============ THE RETRY LADDER ============ -->

  <rect x="30" y="650" width="1120" height="330" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.4"/>
  <text x="50" y="680" font-size="15" font-weight="600" fill="#111827">The retry ladder for a soft decline (example: insufficient funds), clipped inside the calendar month</text>

  <!-- timeline -->
  <line x1="80" y1="760" x2="1100" y2="760" stroke="#9CA3AF" stroke-width="2"/>

  <!-- day D -->
  <circle cx="120" cy="760" r="7" fill="#DC2626"/>
  <text x="98" y="740" font-size="12" font-weight="600" fill="#111827">Day D</text>
  <text x="70" y="790" font-size="11.5" fill="#374151">Billing attempt</text>
  <text x="70" y="806" font-size="11.5" fill="#B91C1C">declines soft</text>

  <!-- +2 -->
  <circle cx="280" cy="760" r="7" fill="#D97706"/>
  <text x="258" y="740" font-size="12" font-weight="600" fill="#111827">D + 2</text>
  <text x="250" y="790" font-size="11.5" fill="#374151">Retry 1: catches</text>
  <text x="250" y="806" font-size="11.5" fill="#374151">transient holds</text>

  <!-- +4 -->
  <circle cx="420" cy="760" r="7" fill="#D97706"/>
  <text x="398" y="740" font-size="12" font-weight="600" fill="#111827">D + 4</text>
  <text x="392" y="790" font-size="11.5" fill="#374151">Retry 2: two-day</text>
  <text x="392" y="806" font-size="11.5" fill="#374151">spacing, not spam</text>

  <!-- +8 -->
  <circle cx="580" cy="760" r="7" fill="#EA580C"/>
  <text x="558" y="740" font-size="12" font-weight="600" fill="#111827">D + 8</text>
  <text x="540" y="790" font-size="11.5" fill="#374151">Retry 3. If it fails,</text>
  <text x="540" y="806" font-size="11.5" fill="#9A3412">DUNNING begins:</text>
  <text x="540" y="822" font-size="11.5" fill="#374151">the member is asked</text>
  <text x="540" y="838" font-size="11.5" fill="#374151">to update the card</text>

  <!-- +15 -->
  <circle cx="760" cy="760" r="7" fill="#2563EB"/>
  <text x="732" y="740" font-size="12" font-weight="600" fill="#111827">D + 15</text>
  <text x="712" y="790" font-size="11.5" fill="#374151">Retry 4: the payday</text>
  <text x="712" y="806" font-size="11.5" fill="#374151">retry, the single best</text>
  <text x="712" y="822" font-size="11.5" fill="#374151">recovery moment for</text>
  <text x="712" y="838" font-size="11.5" fill="#374151">an empty account</text>

  <!-- +22 -->
  <circle cx="920" cy="760" r="7" fill="#D97706"/>
  <text x="892" y="740" font-size="12" font-weight="600" fill="#111827">D + 22</text>
  <text x="880" y="790" font-size="11.5" fill="#374151">Retry 5: the last</text>
  <text x="880" y="806" font-size="11.5" fill="#374151">chance in the month</text>

  <!-- day 26 -->
  <rect x="1035" y="746" width="14" height="28" fill="#6B7280"/>
  <text x="1000" y="740" font-size="12" font-weight="600" fill="#111827">Day 26 of the month</text>
  <text x="1000" y="790" font-size="11.5" fill="#374151">Checkpoint: still</text>
  <text x="1000" y="806" font-size="11.5" fill="#374151">unpaid means</text>
  <text x="1000" y="822" font-size="11.5" fill="#4B5563">SUSPENDED</text>

  <text x="50" y="880" font-size="12.5" font-weight="600" fill="#111827">Three rules that govern the ladder:</text>
  <text x="50" y="902" font-size="12" fill="#374151">1. The offsets count from the member's own billing date, and any retry that would land past day 26 or outside the billing month is dropped, never run late.</text>
  <text x="50" y="922" font-size="12" fill="#374151">2. A member billing on the 28th gets one attempt and no retries: the ladder truncates to zero, disclosed when the date is picked. Days 29 to 31 are not offered.</text>
  <text x="50" y="942" font-size="12" fill="#374151">3. Hard declines (bad number, expired, lost, stolen) skip the ladder entirely. Unclear declines get two retries, then dunning. Unknown codes are treated as unclear.</text>
  <text x="50" y="966" font-size="12" fill="#4B5563">Every count sits far inside the card networks' ceiling of 15 attempts in 30 days, and every date is recomputable by an independent checker from the rules alone.</text>
</svg>
