<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="640" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="21" font-weight="700" fill="#111827">The rank ladder: what each rung requires and what it unlocks</text>
  <text x="30" y="60" font-size="13" fill="#4B5563">Orvanna compensation plan v1.3. Sales Volume (SV), Team Volume (TV). Every rank is recomputed from scratch each month.</text>

  <!-- Column headings -->
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#374151">RANK</text>
  <text x="250" y="96" font-size="12.5" font-weight="700" fill="#374151">EVERY REQUIREMENT MUST HOLD IN THE SAME MONTH</text>
  <text x="810" y="96" font-size="12.5" font-weight="700" fill="#374151">PAID DEPTH</text>

  <!-- EXECUTIVE (top rung) -->
  <rect x="30" y="110" width="920" height="76" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="48" y="140" font-size="16" font-weight="700" fill="#111827">Executive</text>
  <text x="48" y="164" font-size="11.5" fill="#4B5563">rung 5</text>
  <text x="250" y="136" font-size="13" fill="#1F2937">QUALIFIED (own SV 100.00 or more)</text>
  <text x="250" y="156" font-size="13" fill="#1F2937">TV 40,000.00 or more</text>
  <text x="250" y="176" font-size="13" fill="#1F2937">2 or more legs, each holding a Leader or higher somewhere inside</text>
  <text x="838" y="152" font-size="26" font-weight="700" fill="#312E81">5</text>
  <text x="800" y="176" font-size="11.5" fill="#4B5563">levels 1 to 5</text>

  <!-- DIRECTOR -->
  <rect x="30" y="200" width="920" height="76" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="48" y="230" font-size="16" font-weight="700" fill="#111827">Director</text>
  <text x="48" y="254" font-size="11.5" fill="#4B5563">rung 4</text>
  <text x="250" y="226" font-size="13" fill="#1F2937">QUALIFIED (own SV 100.00 or more)</text>
  <text x="250" y="246" font-size="13" fill="#1F2937">TV 10,000.00 or more</text>
  <text x="250" y="266" font-size="13" fill="#1F2937">2 or more legs, each holding a Builder or higher somewhere inside</text>
  <text x="838" y="242" font-size="26" font-weight="700" fill="#312E81">4</text>
  <text x="800" y="266" font-size="11.5" fill="#4B5563">levels 1 to 4</text>

  <!-- LEADER -->
  <rect x="30" y="290" width="920" height="76" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="48" y="320" font-size="16" font-weight="700" fill="#111827">Leader</text>
  <text x="48" y="344" font-size="11.5" fill="#4B5563">rung 3</text>
  <text x="250" y="316" font-size="13" fill="#1F2937">QUALIFIED (own SV 100.00 or more)</text>
  <text x="250" y="336" font-size="13" fill="#1F2937">TV 2,500.00 or more</text>
  <text x="250" y="356" font-size="13" fill="#1F2937">3 or more ACTIVE legs</text>
  <text x="838" y="332" font-size="26" font-weight="700" fill="#1E3A8A">3</text>
  <text x="800" y="356" font-size="11.5" fill="#4B5563">levels 1 to 3</text>

  <!-- BUILDER -->
  <rect x="30" y="380" width="920" height="66" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="48" y="408" font-size="16" font-weight="700" fill="#111827">Builder</text>
  <text x="48" y="430" font-size="11.5" fill="#4B5563">rung 2</text>
  <text x="250" y="406" font-size="13" fill="#1F2937">QUALIFIED (own SV 100.00 or more)</text>
  <text x="250" y="426" font-size="13" fill="#1F2937">2 or more ACTIVE legs</text>
  <text x="838" y="416" font-size="26" font-weight="700" fill="#1E3A8A">2</text>
  <text x="800" y="438" font-size="11.5" fill="#4B5563">levels 1 to 2</text>

  <!-- MEMBER -->
  <rect x="30" y="460" width="920" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="48" y="486" font-size="16" font-weight="700" fill="#111827">Member</text>
  <text x="48" y="508" font-size="11.5" fill="#4B5563">rung 1</text>
  <text x="250" y="492" font-size="13" fill="#1F2937">Enrolled. Nothing else. An unqualified account still holds this rung, but earns nothing.</text>
  <text x="838" y="494" font-size="26" font-weight="700" fill="#374151">1</text>
  <text x="800" y="514" font-size="11.5" fill="#4B5563">level 1 only</text>

  <!-- Definitions strip -->
  <rect x="30" y="540" width="920" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="48" y="564" font-size="12.5" font-weight="700" fill="#111827">Read these three words the way the plan means them</text>
  <text x="48" y="584" font-size="12.5" fill="#374151">LEG: one person you personally sponsored, plus everyone underneath that person, however deep.</text>
  <text x="48" y="602" font-size="12.5" fill="#374151">ACTIVE LEG: a leg whose top person is qualified this month. Their downline's volume does not rescue them.</text>
  <text x="48" y="616" font-size="12.5" fill="#374151">TEAM VOLUME (TV): the SV of everyone below you added up, at any depth. It never includes your own SV.</text>

  <text x="30" y="636" font-size="11.5" fill="#6B7280">You hold the HIGHEST rung whose requirements you meet. Miss one requirement next month and the rung is gone: there is no retention and no grace month.</text>
</svg>
