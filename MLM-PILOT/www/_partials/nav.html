<!-- THE CANONICAL NAVIGATION. Single source for the markup; css/site-chrome.css
     is the single source for its presentation. Changing one without the other
     is what produced the drift these lints exist to stop: on 2026-08-17 the
     pages shared navigation markup but not navigation CSS, and the original
     complaint survived the round meant to fix it.

     Rebuilt 2026-08-18 for the redesign (handoff section 2, screen 6a):
       - the pinwheel mark replaces the hexagon-and-nodes drawing
       - seven links, sentence case, 12.5px/0.04em, active carries a 2px accent
         rule rather than a colour change alone
       - a real disclosure menu under 900px. Eleven controls used to wrap and
         centre-pack, which is why the bar's height changed between pages.
       - the theme control is gone. The new system is mono, so the control was
         a no-op: it wrote a storage key nothing reads differently any more.
       - Enroll is gone with it. It was a disabled placeholder, and a control
         that cannot be pressed is a label, not a control.

     The cart is the only permitted addition, on shop.html and product.html
     only (contract section 2, rule 3). -->
